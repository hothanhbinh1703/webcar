<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porche</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="w-full sticky top-0 z-10 p-[10px] bg-[#111314]">
        <div class="flex justify-around items-center">
            <a href="../index.html" title="Trang chủ"
                class="flex justify-center items-center gap-[10px] cursor-pointer hover:scale-110 transition duration-300">
                <img src="../IMG/logo.png" alt="LogoXe" class="w-[60px] h-[60px] rounded-[10px]" />
                <h1 class="font-bold text-[24px] text-[#E2E2E2]">APEX AUTOMOTIVE</h1>
            </a>
            <div class="flex justify-between gap-10">
                <div
                    class="w-[100px] h-[30px] border border-[#D4D4D4] flex justify-center items-center cursor-pointer rounded-[5px] hover:scale-110 transition duration-300">
                    <a href="#"
                        class="text-[15px] uppercase text-[#E2E2E2] cursor-pointer hover:scale-110 transition duration-300 underline">sport
                        cars</a>
                </div>
            </div>
        </div>
    </header>

<video src="../IMG/Porche.mp4" controls autoplay loop muted class="w-full aspect-video object-cover"></video>
    <div class="relative w-full h-full">
        <video id="clipVideo" src="../IMG/snaptik.vn_7522891065066753282.mp4" controls
            class=" h-[1000px] w-full aspect-video object-cover hidden" onended="backToThumbnail()"></video>

        <div id="thumbnailWrap" class="bg-[#000000] relative w-full h-full">
            <img src="https://porsche-vietnam.vn/wp-content/uploads/2018/02/P17_1153_a5_rgb.jpg"
                class="w-full h-full object-cover opacity-50" />

            <button onclick="playClip()"
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 hover:scale-150 transition duration-300">
                <img src="../IMG/nguon.png" class="h-[50px] w-[50px]" />
            </button>
        </div>
    </div>

    <script>
        function playClip() {
            document.getElementById('thumbnailWrap').classList.add('hidden');
            const video = document.getElementById('clipVideo');
            video.classList.remove('hidden');
            video.play();
        }

        function backToThumbnail() {
            const video = document.getElementById('clipVideo');
            video.classList.add('hidden');
            video.pause();
            video.currentTime = 0;
            document.getElementById('thumbnailWrap').classList.remove('hidden');
        }
    </script>
</body>

</html>
